name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Rodar os testes
        run: mvn -B verify

  imagem-docker:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir a imagem Docker
        run: docker build -t doacao-service .